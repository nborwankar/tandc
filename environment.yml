# Conda environment for tandc.
#
# This file is provided for users who prefer `conda env create -f environment.yml`
# over the README's recommended `conda create + pip install -e .` flow. Both
# paths install the same set of dependencies; pyproject.toml is the source of
# truth — if you add a runtime dep, add it to BOTH files.
#
# Setup:
#   conda env create -f environment.yml
#   conda activate tandc
#   pip install -e .              # adds the tandc entry point
#   export ANTHROPIC_API_KEY=sk-ant-...

name: tandc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Runtime (matches [project] dependencies in pyproject.toml)
      - anthropic>=0.40.0
      - typer>=0.12.0
      - httpx>=0.27.0
      - trafilatura>=1.12.0
      - pydantic>=2.7.0
      - rich>=13.7.0
      - pyyaml>=6.0
      - fastapi>=0.115.0
      - uvicorn[standard]>=0.30.0
      - pypdf>=4.3.0
      - python-multipart>=0.0.9
      # Dev (matches [project.optional-dependencies] dev in pyproject.toml)
      - pytest>=8.0.0
      - pytest-cov>=5.0.0
      - respx>=0.21.0
      - responses>=0.25.0
      - ruff>=0.5.0
