name: tests

# Runs the unit test suite on every push to main and every pull request.
# Only the fast, mocked-Claude tests run here (-m "not slow"). The 6-vendor
# live smoke suite (-m slow) costs ~$0.06 per run and needs a real
# ANTHROPIC_API_KEY, so it stays local — see DONE.md for how to run it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}  # allow manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  unit:
    name: unit (pytest -m "not slow")
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v -m "not slow"
