name: tests

# Runs the 126 mocked-Claude unit tests. Manual-only trigger:
# click "Run workflow" in the Actions tab when you want a fresh run.
#
# The slow live-Claude smoke suite (-m slow) costs ~$0.06 per run and
# needs a real ANTHROPIC_API_KEY — that stays local-only, never CI.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit:
    name: unit (pytest -m "not slow")
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v -m "not slow"
